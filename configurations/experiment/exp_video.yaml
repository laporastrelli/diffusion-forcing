defaults:
  - base_pytorch

tasks: [training]

use_callbacks: false
device: 0

training:
  lr: 2e-4
  precision: 16-mixed
  batch_size: 32
  max_epochs: -1
  max_steps: 100000
  checkpointing:
    every_n_train_steps: null # save a checkpoint every n train steps
  optim:
    gradient_clip_val: 1.0

validation:
  val_every_n_step: null
  val_every_n_epoch: 1000
  batch_size: 100
  limit_batch: 100

test:
  limit_batch: 1
  batch_size: 16

logging:
  metrics:
    - mse
    # - fvd
    # - fid
    # - lpips
