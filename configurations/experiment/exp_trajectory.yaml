defaults:
  - base_pytorch

tasks: [training]

use_callbacks: false
device: 0

training:
  lr: 8e-5
  precision: 16-mixed
  batch_size: 5
  max_epochs: -1
  max_steps: 200005
  checkpointing:
    every_n_train_steps: null
    every_n_epochs: null
  optim:
    gradient_clip_val: 1.0

validation:
  val_every_n_step: null
  val_every_n_epoch: 1000
  batch_size: 100
  limit_batch: 100

test:
  limit_batch: 1
  batch_size: 5

logging:
  metrics:
    - mse
    # - fvd
    # - fid
    # - lpips
