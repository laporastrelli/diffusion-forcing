defaults:
  - base_pytorch_algo

# dataset-dependent configurations
x_shape: ${dataset.observation_shape}
frame_stack: 1
frame_skip: 1
data_mean: ${dataset.data_mean}
data_std: ${dataset.data_std}
external_cond_dim: 0 #${dataset.action_dim}
context_frames: ${dataset.context_length}
# training hyperparameters
weight_decay: 1e-4
warmup_steps: 10000
optimizer_beta: [0.9, 0.999]
# diffusion-related
uncertainty_scale: 1
guidance_scale: 0.0
chunk_size: 1 # -1 for full trajectory diffusion, number to specify diffusion chunk size
scheduling_matrix: autoregressive
noise_level: random_all
causal: True

# Hybrid History Training (simplified post-training) options.
# Disabled by default; enabled during a dedicated post-training stage.
hybrid_history:
  enabled: false
  # Number of GT seed frames used to start generation during post-training.
  seed_frames: 10
  # Total number of *frames* in the prefix used as (partly) model-generated history during post-training.
  # The first `seed_frames` are GT; the remaining prefix frames are generated by the model.
  # Loss is only applied to frames AFTER this prefix.
  generated_prefix_frames: 0
  # Noise level to use for the generated prefix frames during post-training.
  # 0 means "clean" conditioning (closest to test-time usage).
  conditioning_noise_level: 0

# Self-Forcing (autoregressive rollout post-training) options.
# Disabled by default; enabled during a dedicated post-training stage.
self_forcing:
  enabled: false
  # Number of GT seed frames used to start autoregressive generation.
  seed_frames: 10
  # Number of frames generated per autoregressive block.
  block_size: 4
  # Number of denoising steps per block.
  num_denoising_steps: 4
  # Whether to randomly select which timestep to backprop through per block.
  random_exit: true
  # Maximum number of tokens to generate during rollout.
  max_rollout_tokens: -1  # -1 means use all tokens in sequence
  # Noise level to use for generated context frames.
  conditioning_noise_level: 0

diffusion:
  # training
  objective: pred_x0
  beta_schedule: cosine
  schedule_fn_kwargs: {}
  clip_noise: 20.0
  use_snr: False
  use_cum_snr: False
  use_fused_snr: False
  snr_clip: 5.0
  cum_snr_decay: 0.98
  timesteps: 1000
  # sampling
  sampling_timesteps: 50 # fixme, numer of diffusion steps, should be increased
  ddim_sampling_eta: 1.0
  stabilization_level: 10
  # architecture
  architecture:
    network_size: 64
